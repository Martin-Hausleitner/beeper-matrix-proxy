# Example matrix-docker-ansible-deploy / Etke-compatible variables.
# Copy the relevant values into your MDAD inventory. Do not commit real secrets.

matrix_domain: "example.tld"
matrix_homeserver_implementation: synapse

matrix_synapse_enabled: true
matrix_synapse_federation_enabled: true
matrix_synapse_presence_enabled: false
matrix_synapse_url_preview_enabled: false
matrix_synapse_max_upload_size_mb: 100
matrix_synapse_media_retention_local_media_lifetime: 90d
matrix_synapse_media_retention_remote_media_lifetime: 30d

# Keep the first 8 GB deployment monolithic. Add workers only after measuring.
matrix_synapse_workers_enabled: false
matrix_synapse_caches_global_factor: 0.5

matrix_postgres_enabled: true
matrix_postgres_connection_password: "CHANGE_ME_VIA_ANSIBLE_VAULT"

matrix_playbook_reverse_proxy_type: playbook-managed-traefik
matrix_traefik_enabled: true

matrix_client_element_enabled: true
matrix_client_element_hostname: "element.example.tld"

matrix_client_cinny_enabled: true
matrix_client_cinny_hostname: "cinny.example.tld"

# Future auth path. Enable after the base deployment is stable.
matrix_authentication_service_enabled: false

# S3 primary media storage through synapse-s3-storage-provider.
# Keep matrix-media separate from nextcloud-primary and infra-backup.
matrix_synapse_ext_synapse_s3_storage_provider_enabled: true
matrix_synapse_ext_synapse_s3_storage_provider_config_bucket: "matrix-media"
matrix_synapse_ext_synapse_s3_storage_provider_config_region_name: "eu-central"
matrix_synapse_ext_synapse_s3_storage_provider_config_endpoint_url: "https://s3.example-provider.tld"
matrix_synapse_ext_synapse_s3_storage_provider_config_access_key_id: "CHANGE_ME_VIA_ANSIBLE_VAULT"
matrix_synapse_ext_synapse_s3_storage_provider_config_secret_access_key: "CHANGE_ME_VIA_ANSIBLE_VAULT"
matrix_synapse_ext_synapse_s3_storage_provider_config_prefix: "synapse/"
matrix_synapse_ext_synapse_s3_storage_provider_config_store_local: true
matrix_synapse_ext_synapse_s3_storage_provider_config_store_remote: true
matrix_synapse_ext_synapse_s3_storage_provider_config_store_synchronous: true
matrix_synapse_ext_synapse_s3_storage_provider_config_threadpool_size: 8

# Bridges: enable intentionally and budget memory. Start with at most two.
matrix_mautrix_whatsapp_enabled: false
matrix_mautrix_signal_enabled: false
matrix_mautrix_telegram_enabled: false
matrix_mautrix_discord_enabled: false

# Bots: enable after bridge and media baseline is stable.
matrix_bot_maubot_enabled: false
matrix_bot_draupnir_enabled: false

# TURN and push are optional; enable only when needed.
matrix_coturn_enabled: false
matrix_sygnal_enabled: false
