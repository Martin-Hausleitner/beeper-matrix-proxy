name: openclaw-chatwoot-local

services:
  base: &base
    image: chatwoot/chatwoot:latest-ce
    env_file:
      - ${CHATWOOT_ENV_FILE:-${HOME}/Library/Application Support/openclaw-chatwoot-local/.env}
    volumes:
      - chatwoot_storage:/app/storage

  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:${CHATWOOT_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    restart: unless-stopped

  sidekiq:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHATWOOT_POSTGRES_PASSWORD:?set in private env}
    volumes:
      - chatwoot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatwoot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file:
      - ${CHATWOOT_ENV_FILE:-${HOME}/Library/Application Support/openclaw-chatwoot-local/.env}
    volumes:
      - chatwoot_redis:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHATWOOT_MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${CHATWOOT_MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - chatwoot_mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  chatwoot_storage:
  chatwoot_postgres:
  chatwoot_redis:
  chatwoot_mailpit:
